[project]
name = "recoveryai-agent-service"
version = "0.0.0"
description = "LangGraph claim workflow, policy RAG and the negotiation engine"
requires-python = ">=3.12,<3.15"
dependencies = [
    "recoveryai-common",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "pypdf>=5.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_service"]
