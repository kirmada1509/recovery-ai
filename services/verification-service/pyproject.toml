[project]
name = "recoveryai-verification-service"
version = "0.0.0"
description = "Explainable claim verification signals and scoring"
requires-python = ">=3.12,<3.15"
dependencies = [
    "recoveryai-common",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verification_service"]
